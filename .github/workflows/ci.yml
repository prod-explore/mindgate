name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  hub:
    name: hub (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gate/package-lock.json
      - name: Install
        run: npm ci
        working-directory: gate
      - name: Build and test
        run: npm test
        working-directory: gate

  image:
    name: hub (docker image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t mindgate-hub gate
      - name: The image starts and answers /health
        run: |
          docker run -d --name hub -p 3000:3000 \
            -e MINDGATE_MASTER_KEY="$(openssl rand -hex 32)" \
            -e MINDGATE_ADMIN_TOKEN="$(openssl rand -hex 32)" \
            mindgate-hub
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/health && exit 0
            sleep 1
          done
          docker logs hub
          exit 1

  agent:
    name: agent (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - name: Install
        run: npm ci
        working-directory: agent
      - name: Build and test
        run: npm test
        working-directory: agent

  chain:
    name: end to end (hub -> agent -> model runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the hub
        run: npm ci && npm run build
        working-directory: gate
      - name: Build the agent
        run: npm ci && npm run build
        working-directory: agent
      - name: Run the chain
        run: node --test --test-timeout=60000 e2e/*.test.mjs

  tray:
    name: tray (install + syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
        working-directory: tray
      - name: Every source file at least parses
        run: for f in tray/src/*.js tray/scripts/*.js; do node --check "$f"; done

# MindGate Tray — configuration
# Copy to tray.yml and adjust

# Agent HTTP — used to poll the status and to report whether someone is using the PC.
# secret = the same as MINDGATE_NODE_SECRET in agent/.env (it can also be given as the MINDGATE_NODE_SECRET variable).
agent:
  url: "http://localhost:3001"
  secret: "paste-the-MINDGATE_NODE_SECRET-from-agent-.env-here"
  poll_interval_ms: 5000              # how often to check the agent's status

# Hub — the address where you open the panel in a browser. With it, the tray menu gets "Open the MindGate panel".
hub:
  url: "http://hub-address"

# IPC server — a small HTTP server on localhost
ipc:
  port: 3002

# Shutdown guard — conditions that hold a shutdown back
shutdown_guard:
  idle_threshold_seconds: 120         # 2 minutes without input = "idle"

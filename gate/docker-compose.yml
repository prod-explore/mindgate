services:
  gate:
    # Published by CI for amd64 and arm64: `docker compose pull` fetches it (scripts/deploy.sh does that and checks health).
    # MINDGATE_IMAGE_TAG picks another tag, e.g. sha-1a2b3c4 to go back. `docker compose build` builds it from this checkout instead.
    image: ghcr.io/prod-explore/mindgate-hub:${MINDGATE_IMAGE_TAG:-latest}
    build:
      # the image holds the hub and the panel, so it is built from the repository root
      context: ..
      dockerfile: gate/Dockerfile
    container_name: mindgate-gate
    restart: unless-stopped
    env_file: .env
    volumes:
      - mindgate-data:/data
    # The hub writes only to /data (the SQLite database). Everything else is locked down.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The port is not published: the reverse proxy (nginx, Caddy) reaches the hub inside the Docker network.
    # With nothing in front, add docker-compose.local.yml, which publishes it on the loopback only.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mindgate_net

  # Sends the Wake-on-LAN broadcast for a machine that sleeps. A container on a Docker bridge cannot broadcast onto the LAN,
  # so this one runs on the host's own network (same image, different command). It is off unless the profile is on:
  #   COMPOSE_PROFILES=wol   (in .env, together with MINDGATE_WOL_RELAY_TOKEN, MINDGATE_WOL_RELAY_BIND and, for the hub,
  #                           MINDGATE_WOL_RELAY_URL — see .env.example and docs/06-wol.md)
  wol-relay:
    profiles: [wol]
    image: ghcr.io/prod-explore/mindgate-hub:${MINDGATE_IMAGE_TAG:-latest}
    command: ["node", "dist/wol-relay.js"]
    container_name: mindgate-wol-relay
    restart: unless-stopped
    network_mode: host
    environment:
      # the relay refuses to start without a token of at least 16 characters
      MINDGATE_WOL_RELAY_TOKEN: ${MINDGATE_WOL_RELAY_TOKEN:-}
      MINDGATE_WOL_RELAY_BIND: ${MINDGATE_WOL_RELAY_BIND:-127.0.0.1}
      MINDGATE_WOL_RELAY_PORT: ${MINDGATE_WOL_RELAY_PORT:-7009}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The image's own health check looks at the hub's port; the relay answers 404 to a plain GET when it is up.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://'+process.env.MINDGATE_WOL_RELAY_BIND+':'+process.env.MINDGATE_WOL_RELAY_PORT+'/').then(r=>process.exit(r.status===404?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mindgate-data:

networks:
  mindgate_net:
    external: true
